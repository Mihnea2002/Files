<!DOCTYPE html>
<html>
<head>
    <title>VPN Connection Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
    </style>
</head>
<body>
    <h1>VPN & Connection Test</h1>
    <button onclick="runTests()">Run Tests</button>
    <div id="results"></div>

    <script>
        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Running tests...</h2>';

            // Test 1: Check public IP
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                results.innerHTML += `<div class="test success">✅ Your Public IP: ${ipData.ip}</div>`;
            } catch (e) {
                results.innerHTML += `<div class="test error">❌ Cannot check IP: ${e.message}</div>`;
            }

            // Test 2: DNS lookup
            try {
                const dnsResponse = await fetch('https://cloudflare-dns.com/dns-query?name=claude.ai&type=A', {
                    headers: { 'Accept': 'application/dns-json' }
                });
                const dnsData = await dnsResponse.json();
                results.innerHTML += `<div class="test success">✅ DNS Resolution works: ${JSON.stringify(dnsData.Answer?.[0])}</div>`;
            } catch (e) {
                results.innerHTML += `<div class="test error">❌ DNS issue: ${e.message}</div>`;
            }

            // Test 3: Claude.ai reachability
            try {
                const claudeResponse = await fetch('https://claude.ai', { method: 'HEAD' });
                results.innerHTML += `<div class="test success">✅ Can reach claude.ai (${claudeResponse.status})</div>`;
            } catch (e) {
                results.innerHTML += `<div class="test error">❌ Cannot reach claude.ai: ${e.message}</div>`;
            }

            results.innerHTML += '<h3>Instructions:</h3>';
            results.innerHTML += '<ol>';
            results.innerHTML += '<li>Check if your IP is different from your regular IP</li>';
            results.innerHTML += '<li>If IP is the same, VPN is NOT working</li>';
            results.innerHTML += '<li>If IP changed but claude.ai still blocked, continue troubleshooting</li>';
            results.innerHTML += '</ol>';
        }
    </script>
</body>
</html>
